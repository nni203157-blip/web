
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8d7e0">

    <title>一份专属秘密惊喜 · 11.25</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 主体布局 */
        .password-page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            position: relative;
        }

        /* 背景爱心粒子 */
        .heart-particle {
            position: absolute;
            color: rgba(222, 157, 177, .4);
            font-size: 17px;
            animation: heartDrift linear infinite;
            pointer-events: none;
        }

        @keyframes heartDrift {
            0% {
                transform: translateY(110vh) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: .65;
            }

            85% {
                opacity: .5;
            }

            100% {
                transform: translateY(-15vh) rotate(40deg);
                opacity: 0;
            }
        }

        /* 登录卡片 */
        .password-card {
            width: min(430px, 100%);
            padding: 55px 42px 45px;
            border-radius: 28px;
            text-align: center;
            position: relative;
            z-index: 5;

            background: rgba(255, 255, 255, .48);
            border: 1px solid rgba(255, 255, 255, .82);

            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);

            box-shadow:
                0 25px 70px rgba(187, 130, 150, .16),
                inset 0 1px 0 rgba(255, 255, 255, .8);
        }

        .card-decoration {
            width: 52px;
            height: 2px;
            margin: 0 auto 26px;

            background: linear-gradient(
                90deg,
                transparent,
                var(--gold),
                transparent
            );
        }

        .password-card h1 {
            font-size: 25px;
            font-weight: 400;
            letter-spacing: 3px;
            color: #876471;
            margin-bottom: 14px;
        }

        .password-card .subtitle {
            font-size: 13px;
            color: #b69aa5;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 38px;
        }

        /* 密码输入框 */
        .password-input {
            width: 100%;
            height: 50px;
            border-radius: 15px;
            outline: none;

            border: 1px solid rgba(227, 185, 199, .7);
            background: rgba(255, 255, 255, .55);

            text-align: center;
            font-size: 18px;
            letter-spacing: 9px;
            color: #926d7c;

            transition: all .35s ease-out;
            font-family: 'Inter', sans-serif;
        }

        .password-input::placeholder {
            color: #d8bec8;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .password-input:focus {
            border-color: #dfaabb;
            box-shadow: 0 0 0 4px rgba(234, 185, 200, .17);
            background: rgba(255, 255, 255, .85);
        }

        .hint {
            display: none;
        }

        /* 登录按钮 */
        .unlock-button {
            width: 100%;
            height: 49px;
            margin-top: 30px;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 11px;
            color: #c2aab3;
            letter-spacing: 2px;
        }

        /* 小牛插画位置 */
        .cow-decoration {
            width: 160px;
            left: 4%;
            bottom: 3%;
            z-index: 2;
            opacity: .85;
            animation: cowFloat 6s ease-in-out infinite;
        }

        @keyframes cowFloat {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        /* 电影原版 Bob 插画位置 */
        .bob-decoration {
            width: 145px;
            right: 4%;
            bottom: 2%;
            z-index: 2;
            opacity: .98;
            transform-origin: bottom center;
            animation: bobFloat 5s ease-in-out infinite;
        }

        /* Bob 图片 */
        .bob-decoration img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;

            filter: drop-shadow(
                0 8px 12px rgba(130, 95, 105, .15)
            );
        }

        @keyframes bobFloat {
            0%, 100% {
                transform: translateY(0) rotate(-2deg);
            }

            50% {
                transform: translateY(-9px) rotate(2deg);
            }
        }

        /* 密码错误时 Bob 摇晃 */
        .bob-decoration.shake {
            animation: bobShake .65s ease-out;
        }

        /* 错误气泡 */
        .error-bubble {
            position: absolute;
            right: 9%;
            bottom: 240px;
            z-index: 8;

            padding: 13px 18px;
            border-radius: 18px;

            background: rgba(255, 255, 255, .8);
            backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, .9);

            color: #9c7584;
            font-size: 12px;

            opacity: 0;
            transform: translateY(10px);
            transition: all .4s ease-out;

            pointer-events: none;
        }

        .error-bubble.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 手机端适配 */
        @media(max-width: 600px) {
            .password-card {
                padding: 44px 26px 35px;
            }

            .password-card h1 {
                font-size: 22px;
            }

            .cow-decoration {
                width: 105px;
                left: -8px;
                bottom: 12px;
            }

            .bob-decoration {
                width: 90px;
                right: -8px;
                bottom: 12px;
            }

            .error-bubble {
                right: 10px;
                bottom: 135px;
            }
        }
    </style>
</head>

<body data-bgm-track="normal">

    <!-- 全局音乐控制 -->

        <div></div>

        <button class="glass-button" id="musicToggle">
            <span>♫</span>

    <!-- 背景音乐 -->
    <audio id="backgroundMusic" loop>

        </div>

        <!-- 电影原版 Bob -->
        <div class="illustration bob-decoration" id="bobDecoration">
            <img
                src="assets/images/minions/bob.png"

        <!-- 密码错误提示 -->

    </main>
